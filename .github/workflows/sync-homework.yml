name: Synchro devoirs Pronote (ENT)

# Synchronise les devoirs de Malick et Codou (etablissement avec ENT, voir
# CONTEXT.md et bootstrap/sync_homework.py) dans le KV Cloudflare que le
# Worker lit ensuite. Tourne cote GitHub (gratuit), pas besoin que le PC de
# la maison soit allume.
#
# Cinq passages par jour, en UTC : 08h07, 12h07, 15h07, 18h07 et 21h07 heure
# de Paris en ete.
#
# Le cron precedent demandait un passage toutes les 30 minutes et en obtenait
# trois par jour : GitHub ne garantit pas les evenements "schedule", il les
# retarde et les abandonne sous charge, et il penalise d'autant plus les crons
# frequents. Demander moins est ici le moyen d'obtenir plus - et surtout, le
# calendrier annonce correspond enfin a ce qui se passe.
#
# La minute 07 est volontaire : tout le monde programme a l'heure pile, ce qui
# est le pire moment pour etre servi.

on:
  schedule:
    - cron: "7 6,10,13,16,19 * * *"
  workflow_dispatch: {} # bouton "Run workflow" pour forcer une synchro immediate

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        working-directory: bootstrap
        run: pip install -r requirements.txt

      - name: Synchroniser
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}

          PRONOTE_MALICK_URL: ${{ secrets.PRONOTE_MALICK_URL }}
          PRONOTE_MALICK_USERNAME: ${{ secrets.PRONOTE_MALICK_USERNAME }}
          PRONOTE_MALICK_PASSWORD: ${{ secrets.PRONOTE_MALICK_PASSWORD }}
          PRONOTE_MALICK_UUID: ${{ secrets.PRONOTE_MALICK_UUID }}
          PRONOTE_MALICK_CLIENT_ID: ${{ secrets.PRONOTE_MALICK_CLIENT_ID }}

          PRONOTE_CODOU_URL: ${{ secrets.PRONOTE_CODOU_URL }}
          PRONOTE_CODOU_USERNAME: ${{ secrets.PRONOTE_CODOU_USERNAME }}
          PRONOTE_CODOU_PASSWORD: ${{ secrets.PRONOTE_CODOU_PASSWORD }}
          PRONOTE_CODOU_UUID: ${{ secrets.PRONOTE_CODOU_UUID }}
          PRONOTE_CODOU_CLIENT_ID: ${{ secrets.PRONOTE_CODOU_CLIENT_ID }}
        run: python sync_homework.py
