name = "devoirs-pronote"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PRONOTE_CACHE"
id = "7d399b42418b49bc8163fbca3e9d5496"

# Secrets a ajouter par enfant (jamais dans ce fichier ni dans une conversation) :
#   npx wrangler secret put PRONOTE_MALICK_URL
#   npx wrangler secret put PRONOTE_MALICK_USERNAME
#   npx wrangler secret put PRONOTE_MALICK_PASSWORD
#   npx wrangler secret put PRONOTE_CODOU_URL
#   npx wrangler secret put PRONOTE_CODOU_USERNAME
#   npx wrangler secret put PRONOTE_CODOU_PASSWORD
# Obligatoire pour que /parent reponde (sinon toujours 403) :
#   npx wrangler secret put PARENT_ACCESS_TOKEN
